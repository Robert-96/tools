name: Tests

on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  lint:
    name: Lint Code Base

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load super-linter env variables
        run: |
          cat .github/super-linter.env >> "$GITHUB_ENV"

      - name: Run Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-pyregex-utils:
    name: Test pyregex-utils

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    defaults:
      run:
        working-directory: ./pyregex-utils

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run Tests
        run: |
          python -m pytest -v --doctest-modules --cov-report markdown

      - name: Add markdown summary
        run: |
          echo "# Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
