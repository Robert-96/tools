[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-compare-df"
version = "0.1.0"
description = "Compare pandas DataFrames and export their differences."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
py-compare-df = "py_compare_df.compare:cli"

[tool.setuptools]
packages = ["py_compare_df"]
package-dir = { py_compare_df = "src" }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.coverage.run]
patch = ["subprocess"]
